{% extends "base.html" %}

{% block titulo_pagina %}
    <h2 class="titulo_pagina">{{ acao }} de Produto</h2>
{% endblock %}

{% block conteudo %}

<form action="/produtos/salvar/" method="post">

    {% csrf_token %}

    <input id="acao" name="acao" type="hidden" value="{{ acao }}">
    
    {% if acao == 'Exclusão' %}
        <p>Deseja realmente excluir este registro?</p>
        <br>

        <!-- Campos como hidden inputs para exclusão -->
        {{ form.id }}
        <input type="hidden" name="descricao" value="{{ form.descricao.value }}">
        <input type="hidden" name="preco_unitario" value="{{ form.preco_unitario.value }}">
        <input type="hidden" name="quantidade_estoque" value="{{ form.quantidade_estoque.value }}">
        <input type="hidden" name="categoria_id" value="{{ form.categoria_id.value }}">

        <input class="btn-del" type="submit" value="Excluir">
    {% else %}
        <!-- CAMPOS VISÍVEIS PARA INCLUSÃO/ALTERAÇÃO -->
        {{ form.as_p}}

        <br><br>

        <button class="btn" type="submit">Salvar</button>
    {% endif %}
    &nbsp;
    <a class="btn-def" href="{% url 'produtos' %}">Cancelar</a>        

</form>

{% endblock %}
